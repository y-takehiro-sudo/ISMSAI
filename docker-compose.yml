# ─────────────────────────────────────────────
# ローカル開発用 docker-compose
# 使い方: docker compose up -d
# ─────────────────────────────────────────────
services:
  isms:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # ローカル開発時はコードをマウントしてホットリロード可能にする
      - .:/app
      # DBとログはホスト側に永続化
      - ./isms.db:/app/isms.db
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    command: >
      python -m uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
