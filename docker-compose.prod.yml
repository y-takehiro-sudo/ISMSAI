# ─────────────────────────────────────────────
# 本番サーバ用 docker-compose
# 使い方（サーバ上で）:
#   sudo docker compose -f docker-compose.prod.yml build
#   sudo docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────
services:
  isms:
    build: .
    # ポート番号は開発課に申請して割り当てられた番号に変更すること
    # expose: コンテナ内でのみ公開（ホストnginxがproxy_passで受ける）
    expose:
      - "8000"
    ports:
      # 開発課から割り当てられたポート番号に変更すること（例: 18001:8000）
      - "8000:8000"
    volumes:
      # DBはホスト側に永続化（コンテナ再起動してもデータが消えない）
      - /opt/isms/data/isms.db:/app/isms.db
      # ログをホスト側から確認できるようにマウント
      - /opt/isms/logs:/app/logs
      # アップロードファイルを永続化
      - /opt/isms/uploads:/app/uploads
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    # 本番ではreloadなし・workersは1（SQLiteはシングルプロセス推奨）
    command: >
      python -m uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --log-level info
    restart: always
    # ヘルスチェック（コンテナが正常に動いているか自動確認）
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
