<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ISMS - ポータル{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    * { transition-property: background-color, border-color, color, opacity; transition-duration: 150ms; }
    #tip-popup {
      position: fixed; z-index: 9999; max-width: 300px;
      background: #1e293b; color: #e2e8f0;
      font-size: 0.75rem; line-height: 1.6;
      border-radius: 0.75rem; padding: 0.625rem 0.875rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      pointer-events: none; opacity: 0; transform: translateY(-4px);
      transition: opacity 150ms, transform 150ms;
    }
    #tip-popup.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .tip-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1rem; height: 1rem; border-radius: 50%;
      background: #e2e8f0; color: #64748b;
      font-size: 0.6rem; font-weight: 700;
      cursor: pointer; border: none; outline: none;
      vertical-align: middle; margin-left: 4px; flex-shrink: 0;
    }
    .tip-btn:hover { background: #c7d2fe; color: #4338ca; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">
  <nav class="bg-slate-900 border-b border-slate-800 px-6 py-0 flex items-center h-14 flex-shrink-0">
    <!-- Logo -->
    <div class="flex items-center gap-2.5 mr-6">
      <div class="w-7 h-7 bg-indigo-500 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0 013 12c0 3.313 1.343 6.315 3.513 8.494M12 3v1.25m0 15.5V21m8.25-8.25H21M3.75 12H3m15.364-5.636l-.884.884M5.636 18.364l-.884.884m12.728 0l-.884-.884M6.52 5.756l-.884-.884"/>
        </svg>
      </div>
      <span class="text-white font-semibold text-sm tracking-tight">ISMS Manager</span>
    </div>

    <!-- ページタイトル -->
    <div class="flex items-center gap-2 text-slate-300 text-sm">
      <span class="text-slate-500">|</span>
      <span>{{ user.name }} さんのポータル</span>
    </div>

    <!-- 右側: 管理画面リンク（adminのみ）+ ログアウト -->
    <div class="ml-auto flex items-center gap-3">
      {% if user.role == "admin" %}
      <a href="/admin/top"
         class="flex items-center gap-1.5 text-indigo-300 hover:text-indigo-100 text-sm font-medium px-3 py-1.5 rounded-lg hover:bg-slate-800 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75"/>
        </svg>
        管理画面へ
      </a>
      {% endif %}
      <a href="/logout"
         class="flex items-center gap-1.5 text-slate-400 hover:text-white text-sm px-3 py-1.5 rounded-lg hover:bg-slate-800 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
        </svg>
        ログアウト
      </a>
    </div>
  </nav>

  <div id="tip-popup"></div>
  <main class="flex-1 p-6 max-w-screen-xl mx-auto w-full">
    {% block content %}{% endblock %}
  </main>
  <script>
    (function() {
      const popup = document.getElementById('tip-popup');
      let current = null;
      function show(btn) {
        popup.innerHTML = btn.getAttribute('data-tip') || '';
        popup.classList.add('visible'); current = btn; reposition(btn);
      }
      function hide() { popup.classList.remove('visible'); current = null; }
      function reposition(btn) {
        const r = btn.getBoundingClientRect();
        const pw = Math.min(300, window.innerWidth - 16);
        let left = r.left;
        let top = r.bottom + 6;
        if (left + pw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - pw - 8);
        if (left < 8) left = 8;
        if (top + 150 > window.innerHeight - 8) top = r.top - 150 - 6;
        popup.style.left = left + 'px';
        popup.style.top = top + 'px';
        popup.style.maxWidth = pw + 'px';
      }
      document.addEventListener('click', function(e) {
        const btn = e.target.closest('[data-tip]');
        if (btn) { e.stopPropagation(); if (current === btn) { hide(); return; } show(btn); }
        else hide();
      });
      window.addEventListener('scroll', function() { if (current) reposition(current); }, true);
    })();
  </script>
</body>
</html>
