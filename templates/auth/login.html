<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - ISMS Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="inline-flex w-12 h-12 bg-indigo-600 rounded-xl items-center justify-center mb-3">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0 013 12c0 3.313 1.343 6.315 3.513 8.494M12 3v1.25m0 15.5V21m8.25-8.25H21M3.75 12H3"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-slate-900">ISMS Manager</h1>
      <p class="text-sm text-slate-500 mt-1">ログインしてください</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">ログインID</label>
        <input type="text" name="login_id" required autofocus
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">パスワード</label>
        <input type="password" name="password" required
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition-colors text-sm">
        ログイン
      </button>
    </form>
  </div>
</body>
</html>
