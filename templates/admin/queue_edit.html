{% extends "base.html" %}
{% block title %}通知編集 - ISMS管理{% endblock %}
{% block content %}
<div class="flex items-center gap-3 mb-6">
  <a href="/admin/queue" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center gap-1">← 送信前キュー</a>
  <h1 class="text-2xl font-bold text-slate-900">通知メッセージ編集</h1>
</div>
<form method="post" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 max-w-2xl space-y-4">
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">送信先ユーザー</label>
    <select name="target_user_id" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none">
      <option value="">— 変更しない —</option>
      {% for u in users %}
      <option value="{{ u.id }}" {% if item.target_user_id == u.id %}selected{% endif %}>{{ u.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">送信予定日時</label>
    <input type="datetime-local" name="scheduled_at"
      value="{{ item.scheduled_at[:16] if item.scheduled_at else '' }}"
      class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none">
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">メッセージ本文</label>
    <textarea name="message_body" rows="6" required
      class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none">{{ item.message_body }}</textarea>
  </div>
  <div class="flex gap-3">
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition-colors duration-150">保存</button>
    <a href="/admin/queue" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-6 py-2 rounded-lg text-sm font-medium transition-colors duration-150">キャンセル</a>
  </div>
</form>
{% endblock %}
